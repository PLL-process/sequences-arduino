<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="s1Title s1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="s1Title">Séance 1 — Observer les signaux</title>
  <desc id="s1Desc">Illustration pédagogique comparant le signal analogique du capteur d’humidité A0 et la commande logique D6 de l’Arduino. La pompe est placée à côté du pot et reste arrêtée avec D6 à LOW.</desc>

  <defs>
    <linearGradient id="s1Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#f7fff9"/>
    </linearGradient>
    <linearGradient id="s1Board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18b5a7"/>
      <stop offset="1" stop-color="#08665f"/>
    </linearGradient>
    <linearGradient id="s1Leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#72e6aa"/>
      <stop offset="1" stop-color="#168a55"/>
    </linearGradient>
    <filter id="s1Shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#163b4a" flood-opacity="0.18"/>
    </filter>
    <marker id="s1ArrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#2d6aff"/>
    </marker>
    <marker id="s1ArrowOrange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#ff7a00"/>
    </marker>
    <style>
      .label{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#123747}
      .title{font-size:29px;font-weight:900}
      .subtitle{font-size:17px;font-weight:700}
      .body{font-size:15px;font-weight:650}
      .small{font-size:13px;font-weight:650}
      .mono{font-family:Consolas,"Courier New",monospace;font-size:15px}
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#s1Bg)"/>

  <g filter="url(#s1Shadow)">
    <rect x="28" y="24" width="1224" height="74" rx="18" fill="#ffffff" stroke="#17465a" stroke-width="2"/>
    <circle cx="70" cy="61" r="22" fill="#22c98a"/>
    <path d="M58 62 L67 71 L83 50" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="56" class="label title">Séance 1 — Observer les signaux</text>
    <text x="108" y="82" class="label subtitle">A0 mesure une valeur analogique ; D6 commande un état logique LOW ou HIGH.</text>
  </g>

  <!-- Partie analogique -->
  <g filter="url(#s1Shadow)">
    <rect x="28" y="116" width="356" height="390" rx="20" fill="#ffffff" stroke="#2d6aff" stroke-width="3"/>
    <rect x="48" y="134" width="316" height="48" rx="12" fill="#eaf0ff"/>
    <text x="206" y="165" text-anchor="middle" class="label subtitle" fill="#174dc4">Signal analogique — A0</text>

    <path d="M86 350 L220 350 L206 478 L100 478 Z" fill="#c66d3d" stroke="#6a3219" stroke-width="3"/>
    <rect x="80" y="338" width="146" height="20" rx="5" fill="#e58e59" stroke="#6a3219" stroke-width="3"/>
    <rect x="93" y="352" width="120" height="14" fill="#3b2819"/>
    <path d="M155 340 Q151 288 160 230" fill="none" stroke="#2e7d32" stroke-width="7" stroke-linecap="round"/>
    <path d="M159 266 Q210 244 229 205 Q188 212 159 266 Z" fill="url(#s1Leaf)" stroke="#14623d" stroke-width="2"/>
    <path d="M154 292 Q111 274 88 239 Q128 244 154 292 Z" fill="url(#s1Leaf)" stroke="#14623d" stroke-width="2"/>
    <path d="M158 316 Q205 304 225 275 Q187 278 158 316 Z" fill="url(#s1Leaf)" stroke="#14623d" stroke-width="2"/>

    <rect x="122" y="352" width="16" height="86" rx="4" fill="#eef3f5" stroke="#284c5b" stroke-width="2"/>
    <line x1="126" y1="438" x2="126" y2="466" stroke="#284c5b" stroke-width="2"/>
    <line x1="134" y1="438" x2="134" y2="466" stroke="#284c5b" stroke-width="2"/>
    <line x1="130" y1="352" x2="130" y2="318" stroke="#2d6aff" stroke-width="4"/>
    <rect x="93" y="287" width="74" height="34" rx="9" fill="#ffffff" stroke="#2d6aff" stroke-width="2"/>
    <text x="130" y="310" text-anchor="middle" class="label subtitle" fill="#174dc4">A0</text>

    <rect x="244" y="204" width="104" height="244" rx="16" fill="#f6f9ff" stroke="#90aeea" stroke-width="2"/>
    <text x="296" y="228" text-anchor="middle" class="label body">Humidité</text>
    <rect x="272" y="248" width="48" height="168" rx="20" fill="#dde7fb" stroke="#7894ca" stroke-width="2"/>
    <rect x="277" y="320" width="38" height="91" rx="15" fill="#2d6aff"/>
    <circle cx="296" cy="320" r="11" fill="#ffffff" stroke="#2d6aff" stroke-width="4"/>
    <text x="296" y="442" text-anchor="middle" class="label subtitle" fill="#174dc4">35 %</text>

    <g class="label small">
      <text x="61" y="474">Valeurs possibles :</text>
      <rect x="61" y="482" width="66" height="28" rx="8" fill="#edf2ff" stroke="#2d6aff"/><text x="94" y="501" text-anchor="middle">15 %</text>
      <rect x="133" y="482" width="66" height="28" rx="8" fill="#edf2ff" stroke="#2d6aff"/><text x="166" y="501" text-anchor="middle">35 %</text>
      <rect x="205" y="482" width="66" height="28" rx="8" fill="#edf2ff" stroke="#2d6aff"/><text x="238" y="501" text-anchor="middle">62 %</text>
      <rect x="277" y="482" width="66" height="28" rx="8" fill="#edf2ff" stroke="#2d6aff"/><text x="310" y="501" text-anchor="middle">85 %</text>
    </g>
  </g>

  <!-- Arduino central -->
  <g filter="url(#s1Shadow)">
    <rect x="406" y="116" width="448" height="390" rx="20" fill="#ffffff" stroke="#0d6d66" stroke-width="3"/>
    <rect x="428" y="134" width="404" height="48" rx="12" fill="#eaf8f5"/>
    <text x="630" y="165" text-anchor="middle" class="label subtitle">Acquérir → Traiter → Communiquer</text>

    <rect x="480" y="214" width="300" height="180" rx="18" fill="url(#s1Board)" stroke="#034b46" stroke-width="4"/>
    <rect x="494" y="230" width="272" height="13" rx="3" fill="#edf3f5"/>
    <rect x="494" y="367" width="272" height="13" rx="3" fill="#edf3f5"/>
    <rect x="579" y="274" width="100" height="48" rx="7" fill="#172329"/>
    <rect x="498" y="275" width="50" height="34" rx="5" fill="#dfe8eb"/>
    <circle cx="707" cy="291" r="6" fill="#ffd633"/>
    <circle cx="727" cy="291" r="6" fill="#4ade80"/>
    <text x="630" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="900" fill="#ffffff">Arduino UNO</text>

    <circle cx="503" cy="238" r="8" fill="#2d6aff"/>
    <rect x="451" y="190" width="104" height="37" rx="10" fill="#ffffff" stroke="#2d6aff" stroke-width="2"/>
    <text x="503" y="216" text-anchor="middle" class="label subtitle" fill="#174dc4">Entrée A0</text>

    <circle cx="754" cy="238" r="8" fill="#ff7a00"/>
    <rect x="703" y="190" width="102" height="37" rx="10" fill="#ffffff" stroke="#ff7a00" stroke-width="2"/>
    <text x="754" y="216" text-anchor="middle" class="label subtitle" fill="#b44d00">Sortie D6</text>

    <rect x="462" y="415" width="336" height="64" rx="14" fill="#07131f" stroke="#17465a" stroke-width="2"/>
    <text x="486" y="441" class="mono" fill="#8ea4b0">Mesure reçue :</text>
    <text x="626" y="441" class="mono" fill="#67e8f9">humidite = 35</text>
    <text x="486" y="465" class="mono" fill="#8ea4b0">Sortie logique :</text>
    <text x="626" y="465" class="mono" fill="#fb7185">D6 = LOW</text>
  </g>

  <!-- Liaisons -->
  <path d="M166 318 Q330 230 503 238" fill="none" stroke="#2d6aff" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#s1ArrowBlue)"/>
  <path d="M754 238 Q900 205 940 275" fill="none" stroke="#ff7a00" stroke-width="6" marker-end="url(#s1ArrowOrange)"/>

  <!-- Partie logique -->
  <g filter="url(#s1Shadow)">
    <rect x="876" y="116" width="376" height="390" rx="20" fill="#ffffff" stroke="#ff7a00" stroke-width="3"/>
    <rect x="896" y="134" width="336" height="48" rx="12" fill="#fff3e8"/>
    <text x="1064" y="165" text-anchor="middle" class="label subtitle" fill="#b44d00">Signal logique — D6</text>

    <rect x="910" y="214" width="124" height="102" rx="16" fill="#23345a" stroke="#101a30" stroke-width="3"/>
    <circle cx="936" cy="263" r="9" fill="#ff7a00"/>
    <rect x="956" y="243" width="62" height="40" rx="7" fill="#ffffff"/>
    <text x="987" y="269" text-anchor="middle" class="label body">Relais</text>

    <rect x="1060" y="220" width="158" height="88" rx="15" fill="#292d38" stroke="#101219" stroke-width="3"/>
    <circle cx="1088" cy="264" r="8" fill="#40d98c"/>
    <rect x="1108" y="240" width="94" height="47" rx="7" fill="#ffffff"/>
    <text x="1155" y="258" text-anchor="middle" class="label small">Alimentation</text>
    <text x="1155" y="278" text-anchor="middle" class="label small">séparée TBT</text>

    <rect x="927" y="347" width="116" height="72" rx="27" fill="#e9f0f2" stroke="#214b5a" stroke-width="4"/>
    <circle cx="965" cy="383" r="23" fill="#54727d" stroke="#214b5a" stroke-width="3"/>
    <path d="M965 366 L982 383 L965 400 L948 383 Z" fill="#3dd7e6"/>
    <text x="1014" y="378" text-anchor="middle" class="label body">Pompe</text>
    <text x="1014" y="399" text-anchor="middle" class="label small" fill="#fb7185">ARRÊTÉE</text>

    <path d="M1090 438 L1215 438 L1200 492 L1104 492 Z" fill="#c97342" stroke="#6c3217" stroke-width="3"/>
    <rect x="1085" y="428" width="135" height="17" rx="5" fill="#e6925d" stroke="#6c3217" stroke-width="3"/>
    <rect x="1096" y="440" width="112" height="12" fill="#3a2618"/>
    <path d="M1151 430 Q1148 390 1157 348" fill="none" stroke="#277a3e" stroke-width="6"/>
    <path d="M1156 374 Q1194 357 1212 328 Q1176 333 1156 374 Z" fill="url(#s1Leaf)" stroke="#14623d" stroke-width="2"/>
    <path d="M1151 396 Q1117 382 1100 356 Q1130 360 1151 396 Z" fill="url(#s1Leaf)" stroke="#14623d" stroke-width="2"/>

    <rect x="900" y="454" width="172" height="38" rx="10" fill="#ffe9ec" stroke="#fb7185" stroke-width="2"/>
    <text x="986" y="479" text-anchor="middle" class="label body" fill="#b9233b">D6 = LOW = 0</text>
    <rect x="1080" y="454" width="150" height="38" rx="10" fill="#f3f6f8" stroke="#718997" stroke-width="2"/>
    <text x="1155" y="479" text-anchor="middle" class="label body">Relais ouvert</text>
  </g>

  <!-- Bandeau pédagogique -->
  <g filter="url(#s1Shadow)">
    <rect x="28" y="526" width="1224" height="166" rx="20" fill="#07131f" stroke="#17465a" stroke-width="2"/>

    <rect x="48" y="546" width="448" height="126" rx="14" fill="#0d1e2d" stroke="#2c465a"/>
    <text x="68" y="574" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff">Algorithme de la séance</text>
    <g font-family="system-ui, sans-serif" font-size="14" font-weight="700">
      <rect x="68" y="590" width="95" height="27" rx="8" fill="#2d6aff"/><text x="115" y="609" text-anchor="middle" fill="#fff">ACQUÉRIR</text><text x="176" y="609" fill="#dce9ef">Lire l’humidité sur A0</text>
      <rect x="68" y="623" width="95" height="27" rx="8" fill="#9b5de5"/><text x="115" y="642" text-anchor="middle" fill="#fff">MÉMORISER</text><text x="176" y="642" fill="#dce9ef">Stocker la valeur</text>
      <rect x="300" y="590" width="105" height="27" rx="8" fill="#06b6d4"/><text x="352" y="609" text-anchor="middle" fill="#fff">COMMUNIQUER</text><text x="418" y="609" fill="#dce9ef">Afficher</text>
      <rect x="300" y="623" width="105" height="27" rx="8" fill="#fb7185"/><text x="352" y="642" text-anchor="middle" fill="#fff">SÉCURISER</text><text x="418" y="642" fill="#dce9ef">D6 à LOW</text>
    </g>

    <rect x="518" y="546" width="714" height="126" rx="14" fill="#020b09" stroke="#2f6553" stroke-width="2"/>
    <text x="540" y="574" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff">Programme Python de référence</text>
    <text x="540" y="601" class="mono" fill="#83948d"># Lire la grandeur analogique du capteur A0</text>
    <text x="540" y="624" class="mono" fill="#f0fff5">humidite = </text><text x="647" y="624" class="mono" fill="#60a5fa">lire_humidite()</text>
    <text x="790" y="601" class="mono" fill="#83948d"># Afficher la valeur mesurée</text>
    <text x="790" y="624" class="mono" fill="#67e8f9">afficher</text><text x="857" y="624" class="mono" fill="#f0fff5">(humidite)</text>
    <text x="1010" y="601" class="mono" fill="#83948d"># Sécuriser</text>
    <text x="1010" y="624" class="mono" fill="#fb7185">stop()</text>
  </g>
</svg>
