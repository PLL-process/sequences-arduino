    <text x="180" y="315" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#5A2E99" text-anchor="middle" paint-order="stroke fill" stroke="#FFFFFF" stroke-width="3">A2</text>
    <rect x="105" y="558" width="150" height="26" rx="6" fill="#FFFFFF" stroke="#0D3B4F" stroke-width="1.5"/>
