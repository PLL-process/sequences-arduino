<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="heroTitle heroDesc" preserveAspectRatio="xMidYMid meet">
  <title id="heroTitle">TechnoQuest — Jardin connecté</title>
  <desc id="heroDesc">Illustration d'un système d'arrosage automatique : plante, capteur d'humidité, photorésistance LDR (Light-Dependent Resistor), capteur de niveau, carte Arduino UNO, relais, alimentation TBT (très basse tension) séparée, pompe et réservoir reliés par un circuit d'eau. Des flèches indiquent la chaîne d'information et la chaîne d'énergie. Version corrigée avec connexion D6 réaliste, couleurs distinctes par capteur, pompe placée à côté du pot, composants électroniques déplacés en zone sèche, cartouches supplémentaires et identifiants SVG harmonisés.</desc>

  <defs>
    <linearGradient id="gradient-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF4FF"/>
      <stop offset="1" stop-color="#F7FBFF"/>
    </linearGradient>
    <linearGradient id="gradient-soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B4A2B"/>
      <stop offset="1" stop-color="#3E2A18"/>
    </linearGradient>
    <linearGradient id="gradient-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FE0FF"/>
      <stop offset="1" stop-color="#00A8D6"/>
    </linearGradient>
    <linearGradient id="gradient-leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EE3A1"/>
      <stop offset="1" stop-color="#00A65E"/>
    </linearGradient>
    <linearGradient id="gradient-arduino" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00A99D"/>
      <stop offset="1" stop-color="#006F68"/>
    </linearGradient>
    <radialGradient id="gradient-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE680"/>
      <stop offset="1" stop-color="#FFD600" stop-opacity="0"/>
    </radialGradient>
  </defs>

