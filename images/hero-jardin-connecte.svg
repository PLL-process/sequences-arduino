<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="heroJardinTitle heroJardinDesc" preserveAspectRatio="xMidYMid meet">
  <title id="heroJardinTitle">TechnoQuest — Jardin connecté</title>
  <desc id="heroJardinDesc">Illustration pédagogique d’un jardin connecté. Les capteurs A0, A1 et A2 transmettent leurs mesures à une carte Arduino. La sortie D6 commande un relais. Une alimentation séparée en très basse tension fournit l’énergie à la pompe. L’eau circule du réservoir vers la pompe puis vers la plante.</desc>

  <defs>
    <linearGradient id="heroJardinSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff5ff"/>
      <stop offset="0.62" stop-color="#f5fcff"/>
      <stop offset="1" stop-color="#e8f7ef"/>
    </linearGradient>
    <linearGradient id="heroJardinWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8be7ff"/>
      <stop offset="1" stop-color="#089fc9"/>
    </linearGradient>
    <linearGradient id="heroJardinBoard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16b8a9"/>
      <stop offset="1" stop-color="#08655e"/>
    </linearGradient>
    <linearGradient id="heroJardinLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ce6a7"/>
      <stop offset="1" stop-color="#15915b"/>
    </linearGradient>
    <linearGradient id="heroJardinSoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#745033"/>
      <stop offset="1" stop-color="#3a2618"/>
    </linearGradient>
    <filter id="heroJardinShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#0b2430" flood-opacity="0.22"/>
    </filter>
    <marker id="heroArrowA0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#2d6aff"/>
    </marker>
    <marker id="heroArrowA1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#e5b800"/>
    </marker>
    <marker id="heroArrowA2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#9b5de5"/>
    </marker>
    <marker id="heroArrowD6" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#ff7a00"/>
    </marker>
    <marker id="heroArrowPower" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#ef4444"/>
    </marker>
    <marker id="heroArrowWater" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#06b6d4"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#heroJardinSky)"/>
  <circle cx="1120" cy="112" r="58" fill="#ffd54a" opacity="0.96"/>
  <circle cx="1120" cy="112" r="92" fill="none" stroke="#ffd54a" stroke-width="18" opacity="0.22"/>

  <path d="M0 572 Q640 536 1280 572 L1280 720 L0 720 Z" fill="url(#heroJardinSoil)"/>
  <path d="M0 572 Q640 536 1280 572" fill="none" stroke="#25170e" stroke-width="3" opacity="0.3"/>
  <g fill="#9a7657" opacity="0.5">
    <circle cx="70" cy="626" r="4"/><circle cx="205" cy="665" r="5"/><circle cx="680" cy="612" r="4"/><circle cx="1185" cy="653" r="5"/>
  </g>

  <!-- Cartouche de titre -->
  <g filter="url(#heroJardinShadow)">
    <rect x="38" y="34" width="390" height="88" rx="18" fill="#ffffff" fill-opacity="0.95" stroke="#163b4a" stroke-width="2"/>
    <circle cx="82" cy="78" r="23" fill="#19b979"/>
    <path d="M71 79 L79 87 L94 68" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="72" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#103443">TechnoQuest</text>
    <text x="120" y="101" font-family="system-ui, sans-serif" font-size="18" font-weight="650" fill="#315869">Jardin connecté</text>
  </g>

  <!-- Plateforme sèche pour l’électronique -->
  <g filter="url(#heroJardinShadow)">
    <rect x="390" y="446" width="520" height="48" rx="14" fill="#d9e4e9" stroke="#536c76" stroke-width="3"/>
    <rect x="420" y="494" width="20" height="70" rx="7" fill="#788e96"/>
    <rect x="860" y="494" width="20" height="70" rx="7" fill="#788e96"/>
    <rect x="516" y="502" width="260" height="34" rx="12" fill="#ffffff" stroke="#78909c" stroke-width="2"/>
    <text x="646" y="525" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="750" fill="#284650">Zone sèche surélevée</text>
  </g>

  <!-- Réservoir et capteur A2 -->
  <g id="heroJardinReservoir" filter="url(#heroJardinShadow)">
    <rect x="70" y="256" width="208" height="288" rx="20" fill="#dff3fa" stroke="#16485c" stroke-width="4"/>
    <rect x="86" y="363" width="176" height="165" rx="12" fill="url(#heroJardinWater)"/>
    <path d="M86 382 Q174 365 262 382 L262 394 Q174 377 86 394 Z" fill="#ffffff" opacity="0.33"/>
    <rect x="168" y="278" width="18" height="182" rx="7" fill="#eef3f6" stroke="#4f6670" stroke-width="2"/>
    <circle cx="177" cy="450" r="10" fill="#9b5de5" stroke="#562d88" stroke-width="3"/>
    <line x1="177" y1="278" x2="177" y2="224" stroke="#9b5de5" stroke-width="5"/>
    <rect x="132" y="192" width="90" height="38" rx="10" fill="#ffffff" stroke="#9b5de5" stroke-width="2"/>
    <text x="177" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#6d35a4">A2</text>
    <rect x="91" y="552" width="166" height="34" rx="9" fill="#ffffff" stroke="#16485c" stroke-width="2"/>
    <text x="174" y="575" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="750" fill="#16485c">Réservoir d’eau</text>
  </g>

  <!-- Arduino -->
  <g id="heroJardinArduino" filter="url(#heroJardinShadow)">
    <rect x="700" y="230" width="254" height="176" rx="18" fill="url(#heroJardinBoard)" stroke="#034b46" stroke-width="4"/>
    <rect x="714" y="246" width="226" height="13" rx="3" fill="#e9f1f3"/>
    <rect x="714" y="377" width="226" height="13" rx="3" fill="#e9f1f3"/>
    <rect x="778" y="285" width="92" height="48" rx="7" fill="#182329" stroke="#05090b" stroke-width="2"/>
    <rect x="718" y="286" width="43" height="30" rx="5" fill="#dfe8eb"/>
    <circle cx="891" cy="304" r="6" fill="#ffd633"/>
    <circle cx="909" cy="304" r="6" fill="#4ade80"/>
    <text x="827" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" font-weight="850" fill="#ffffff">Arduino UNO</text>
    <circle cx="930" cy="253" r="8" fill="#ff7a00" stroke="#733100" stroke-width="2"/>
    <rect x="916" y="195" width="72" height="36" rx="9" fill="#ffffff" stroke="#ff7a00" stroke-width="2"/>
    <text x="952" y="219" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="850" fill="#b44d00">D6</text>
    <circle cx="724" cy="251" r="7" fill="#2d6aff"/><circle cx="750" cy="251" r="7" fill="#e5b800"/><circle cx="776" cy="251" r="7" fill="#9b5de5"/>
  </g>

  <!-- Relais -->
  <g id="heroJardinRelais" filter="url(#heroJardinShadow)">
    <rect x="482" y="276" width="158" height="118" rx="16" fill="#23345a" stroke="#101a30" stroke-width="4"/>
    <rect x="499" y="294" width="124" height="77" rx="9" fill="#334b7c"/>
    <circle cx="521" cy="332" r="9" fill="#ff7a00"/>
    <rect x="545" y="313" width="64" height="39" rx="7" fill="#ffffff"/>
    <text x="577" y="339" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#17213b">Relais</text>
    <rect x="503" y="402" width="116" height="31" rx="8" fill="#ffffff" stroke="#344967" stroke-width="2"/>
    <text x="561" y="423" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="750" fill="#263a50">Commande D6</text>
  </g>

  <!-- Alimentation séparée TBT -->
  <g id="heroJardinAlimentation" filter="url(#heroJardinShadow)">
    <rect x="410" y="344" width="170" height="86" rx="15" fill="#292d38" stroke="#101219" stroke-width="3"/>
    <circle cx="438" cy="386" r="8" fill="#40d98c"/>
    <rect x="458" y="365" width="105" height="42" rx="7" fill="#ffffff"/>
    <text x="511" y="383" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#17212b">Alimentation</text>
    <text x="511" y="401" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="750" fill="#17212b">séparée TBT</text>
  </g>

  <!-- Pompe sur bac de rétention -->
  <g id="heroJardinPompe" filter="url(#heroJardinShadow)">
    <rect x="300" y="522" width="205" height="48" rx="14" fill="#b9d5df" stroke="#4b6b76" stroke-width="3"/>
    <text x="402" y="553" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="750" fill="#27434d">Bac de rétention</text>
    <rect x="344" y="455" width="118" height="74" rx="28" fill="#e9f0f2" stroke="#214b5a" stroke-width="4"/>
    <circle cx="380" cy="492" r="24" fill="#54727d" stroke="#214b5a" stroke-width="3"/>
    <path d="M380 473 L398 492 L380 511 L362 492 Z" fill="#3dd7e6"/>
    <text x="430" y="486" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="850" fill="#183a47">POMPE</text>
    <text x="430" y="507" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3b5964">Actionneur</text>
  </g>

  <!-- Plante et capteur A0 -->
  <g id="heroJardinPlante" filter="url(#heroJardinShadow)">
    <path d="M980 604 L1174 604 L1152 704 L1002 704 Z" fill="#c97342" stroke="#6c3217" stroke-width="4"/>
    <rect x="972" y="590" width="210" height="24" rx="6" fill="#e6925d" stroke="#6c3217" stroke-width="4"/>
    <rect x="986" y="612" width="182" height="16" fill="#3a2618"/>
    <path d="M1073 595 Q1066 500 1080 392" fill="none" stroke="#277a3e" stroke-width="8" stroke-linecap="round"/>
    <path d="M1079 444 Q1140 414 1176 363 Q1112 372 1079 444 Z" fill="url(#heroJardinLeaf)" stroke="#14623d" stroke-width="3"/>
    <path d="M1072 482 Q1008 454 970 407 Q1030 414 1072 482 Z" fill="url(#heroJardinLeaf)" stroke="#14623d" stroke-width="3"/>
    <path d="M1072 531 Q1132 515 1164 472 Q1112 474 1072 531 Z" fill="url(#heroJardinLeaf)" stroke="#14623d" stroke-width="3"/>
    <rect x="1018" y="604" width="18" height="76" rx="5" fill="#eef3f5" stroke="#284c5b" stroke-width="3"/>
    <line x1="1022" y1="680" x2="1022" y2="705" stroke="#284c5b" stroke-width="3"/>
    <line x1="1032" y1="680" x2="1032" y2="705" stroke="#284c5b" stroke-width="3"/>
    <line x1="1027" y1="604" x2="1027" y2="545" stroke="#2d6aff" stroke-width="5"/>
    <rect x="983" y="508" width="88" height="38" rx="10" fill="#ffffff" stroke="#2d6aff" stroke-width="2"/>
    <text x="1027" y="534" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="850" fill="#174dc4">A0</text>
  </g>

  <!-- LDR A1 -->
  <g id="heroJardinLdr" filter="url(#heroJardinShadow)">
    <line x1="1213" y1="592" x2="1213" y2="434" stroke="#284b58" stroke-width="6"/>
    <circle cx="1213" cy="420" r="29" fill="#ffe680" stroke="#7d6000" stroke-width="4"/>
    <path d="M1197 420 Q1213 404 1229 420 Q1213 436 1197 420 Z" fill="none" stroke="#7d6000" stroke-width="3"/>
    <path d="M1198 407 L1228 433 M1228 407 L1198 433" stroke="#7d6000" stroke-width="3"/>
    <line x1="1213" y1="391" x2="1213" y2="342" stroke="#e5b800" stroke-width="5"/>
    <rect x="1169" y="305" width="88" height="38" rx="10" fill="#ffffff" stroke="#e5b800" stroke-width="2"/>
    <text x="1213" y="331" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="850" fill="#9b7900">A1</text>
    <rect x="1171" y="607" width="84" height="34" rx="9" fill="#ffffff" stroke="#284b58" stroke-width="2"/>
    <text x="1213" y="630" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#284b58">LDR</text>
  </g>

  <!-- Chaîne d’information : A0/A1/A2 vers Arduino -->
  <path d="M1027 545 Q970 474 900 406 Q810 320 724 251" fill="none" stroke="#2d6aff" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#heroArrowA0)"/>
  <path d="M1213 342 Q1090 280 940 268 Q835 258 750 251" fill="none" stroke="#e5b800" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#heroArrowA1)"/>
  <path d="M177 224 Q360 165 550 190 Q664 204 776 251" fill="none" stroke="#9b5de5" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#heroArrowA2)"/>

  <!-- Commande logique D6 vers le relais -->
  <path d="M930 253 Q796 174 670 224 Q615 246 622 296" fill="none" stroke="#ff7a00" stroke-width="6" stroke-linecap="round" marker-end="url(#heroArrowD6)"/>

  <!-- Chaîne d’énergie : alimentation séparée -> relais -> pompe -->
  <path d="M580 387 Q601 387 612 371" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" marker-end="url(#heroArrowPower)"/>
  <path d="M530 394 Q500 444 456 470" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" marker-end="url(#heroArrowPower)"/>

  <!-- Circuit hydraulique : réservoir -> pompe -> plante -->
  <path d="M263 476 Q318 476 344 490" fill="none" stroke="#06b6d4" stroke-width="13" stroke-linecap="round" marker-end="url(#heroArrowWater)"/>
  <path d="M462 493 Q718 485 974 596" fill="none" stroke="#06b6d4" stroke-width="13" stroke-linecap="round" marker-end="url(#heroArrowWater)"/>
  <path d="M263 476 Q318 476 344 490" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M462 493 Q718 485 974 596" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M970 595 Q966 612 976 612 Q986 612 982 595 Z" fill="#06b6d4"/>

  <!-- Légende contrastée -->
  <g filter="url(#heroJardinShadow)">
    <rect x="34" y="622" width="862" height="70" rx="16" fill="#ffffff" fill-opacity="0.96" stroke="#183f4e" stroke-width="2"/>
    <line x1="58" y1="646" x2="120" y2="646" stroke="#2d6aff" stroke-width="5" stroke-dasharray="10 8"/>
    <text x="132" y="652" font-family="system-ui, sans-serif" font-size="16" font-weight="750" fill="#183f4e">Information capteurs → Arduino</text>
    <line x1="356" y1="646" x2="418" y2="646" stroke="#ff7a00" stroke-width="6"/>
    <text x="430" y="652" font-family="system-ui, sans-serif" font-size="16" font-weight="750" fill="#183f4e">Commande D6 → relais</text>
    <line x1="622" y1="646" x2="684" y2="646" stroke="#ef4444" stroke-width="7"/>
    <text x="696" y="652" font-family="system-ui, sans-serif" font-size="16" font-weight="750" fill="#183f4e">Énergie TBT → pompe</text>
    <line x1="58" y1="676" x2="120" y2="676" stroke="#06b6d4" stroke-width="10"/>
    <text x="132" y="682" font-family="system-ui, sans-serif" font-size="16" font-weight="750" fill="#183f4e">Eau : réservoir → pompe → plante</text>
    <text x="696" y="682" font-family="system-ui, sans-serif" font-size="14" font-weight="650" fill="#486873">TBT : très basse tension</text>
  </g>
</svg>
